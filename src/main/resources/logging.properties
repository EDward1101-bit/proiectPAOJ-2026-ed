# java.util.logging configuration for the Academic Catalog application.
# Loaded once by ro.unibuc.catalog.config.AppLogger.

# Handlers: console (warnings and above, keeps the interactive menu clean)
# and a rolling file that captures the full INFO trail.
handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Root level: everything at INFO or above is considered.
.level = INFO

# Application package level.
ro.unibuc.catalog.level = INFO

# --- Console handler ---
# Only warnings/errors reach the console so service INFO logs do not
# interfere with the menu output.
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# --- File handler ---
# Full INFO trail is appended to catalog.log in the project root.
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.pattern = catalog.log
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Single-line, ISO-like timestamp: 2026-06-01T10:15:30 INFO logger - message
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT %4$-7s %3$s - %5$s%6$s%n
